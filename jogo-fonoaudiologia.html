<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Jogo gratuito SoulKids de Fonoaudiologia, acessível pelo celular e feito para brincar em família.">
<meta name="theme-color" content="#102f55"><link rel="icon" href="/soulkids-symbol.png">
<link rel="stylesheet" href="/jogos-terapias.css">
<title>Jogo de Fonoaudiologia | SoulKids</title></head>
<body data-game="fono">
<header class="top"><div class="top-inner"><a class="logo" href="/index.html#jogar"><img src="/soulkids-symbol.png" alt="">SoulKids Play</a><a class="back" href="/index.html#jogar">← Todos os jogos</a></div></header>
<main><div class="intro"><span class="eyebrow" id="area">Fonoaudiologia</span><h1 id="title">SoulKids Play</h1><p id="intro-text"></p></div>
<div class="shell">
<section id="start" class="center" aria-label="Começar"><span class="hero-icon" id="hero-icon" aria-hidden="true">🎲</span><span class="badge">Jogo gratuito • Sem cadastro</span><p class="lead" id="lead-text"></p><div class="level-picker" role="group" aria-label="Nível dos desafios"><strong>Escolha a dificuldade</strong><div class="level-buttons"><button type="button" class="level-choice" data-difficulty="1" aria-pressed="false">Inicial</button><button type="button" class="level-choice selected" data-difficulty="2" aria-pressed="true">Intermediário</button><button type="button" class="level-choice" data-difficulty="3" aria-pressed="false">Avançado</button></div></div><button type="button" class="btn" id="begin">Começar a brincar →</button></section>
<section id="play" class="hide" aria-label="Jogo"><div class="progress-head"><span id="counter"></span><button type="button" class="speak" id="audio" hidden>🔊 Ouvir pergunta</button></div><div class="progress" aria-hidden="true"><span id="progress"></span></div><h2 id="question" class="prompt" tabindex="-1"></h2><div id="visual" class="visual" aria-hidden="true"></div><p class="center badge" id="step-label" hidden></p><div id="choices" class="options"></div><p class="feedback" id="feedback" role="status" aria-live="polite" hidden></p><div class="actions"><button type="button" id="next" class="btn hide">Próximo desafio →</button></div></section>
<section id="finish" class="hide center" aria-label="Conclusão"><span class="hero-icon" aria-hidden="true">🎉</span><h2 id="finish-title" class="prompt" tabindex="-1">Missão concluída!</h2><p class="lead">O mais importante foi experimentar, observar e brincar.</p><p id="result" class="score" aria-live="polite"></p><div class="actions"><button type="button" class="btn" id="again">Jogar novamente</button><a class="btn secondary" href="/index.html#jogar">Outros jogos</a></div></section>
</div><p class="footer-note" id="disclaimer"></p><p class="footer-note"><a class="small-link" href="/index.html">Voltar à SoulKids</a> · Experiências inclusivas, sem pontuação clínica.</p></main>

<script src="/jogos-terapias.js" defer></script></body></html>
