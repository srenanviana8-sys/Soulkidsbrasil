name: QA público de cartilhas SoulKids
on:
  push:
    branches: [qa/ritinha-live-20261014]
permissions:
  contents: read
jobs:
  pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Homepage responde publicamente
        run: |
          set -euo pipefail
          status="$(curl --retry 2 --retry-delay 1 -sSL --max-time 60 -w '%{http_code}' -o /tmp/home.html https://soulkidsbrasil.com.br/)"
          echo "HOME_TEST $status $(wc -c </tmp/home.html)"
          test "$status" = 200
          grep -q 'Cartilha_Psicologia_Infantil_SoulKids_16p.pdf' /tmp/home.html
          grep -q 'Cartilha_Psicomotricidade_SoulKids_Versao_Definitiva_16p.pdf' /tmp/home.html
          grep -q 'https://www.instagram.com/soulkids.br/' /tmp/home.html
      - name: Testar downloads reais dos PDFs
        shell: bash
        run: |
          set -euo pipefail
          for p in Cartilha_Psicologia_Infantil_SoulKids_16p.pdf Cartilha_Psicomotricidade_SoulKids_Versao_Definitiva_16p.pdf Turma_da_Ritinha_Historia_01_A_Chegada.pdf Turma_da_Ritinha_para_Colorir.pdf
          do
            status="$(curl --retry 2 --retry-delay 1 -sSL --max-time 90 -w '%{http_code}' -o /tmp/cartilha-test.pdf "https://soulkidsbrasil.com.br/$p")"
            bytes="$(wc -c </tmp/cartilha-test.pdf)"
            magic="$(head -c 5 /tmp/cartilha-test.pdf)"
            echo "PDF_DOWNLOAD_TEST $status $bytes $magic $p"
            test "$status" = 200
            test "$magic" = '%PDF-'
            test "$bytes" -gt 10000
          done
