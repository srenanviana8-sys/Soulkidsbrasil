name: Importar clipe da Ritinha
on:
  push:
    branches:
      - feature/video-boas-vindas-ritinha-20261013
permissions:
  contents: write
jobs:
  save-video:
    if: "!contains(github.event.head_commit.message, 'Adicionar mídia Runway')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Salvar e otimizar vídeo
        env:
          RUNWAY_VIDEO_URL: 'https://dnznrvs05pmza.cloudfront.net/c6055ea8-657e-4563-b6d4-5dca6e8843be.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjk4ZDdlODU5MmU2OWYxNCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjA1MDk0OX0.62LviXfH5WGy80taNbCn79_Rin8wjMiOjkQsRxSImOg'
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --silent --show-error "$RUNWAY_VIDEO_URL" -o /tmp/soulkids-runway-original.mp4
          test -s /tmp/soulkids-runway-original.mp4
          ffmpeg -hide_banner -loglevel error -y -i /tmp/soulkids-runway-original.mp4 -vf 'scale=640:-2,fps=24' -c:v libx264 -pix_fmt yuv420p -crf 29 -preset medium -movflags +faststart -an ritinha-boas-vindas.mp4
          test -s ritinha-boas-vindas.mp4
          echo "Arquivo otimizado: $(wc -c < ritinha-boas-vindas.mp4) bytes"
      - name: Publicar mídia na ramificação
        run: |
          set -euo pipefail
          git config user.name "SoulKids Video Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ritinha-boas-vindas.mp4
          git commit -m "Adicionar mídia Runway da Ritinha"
          git push origin HEAD:feature/video-boas-vindas-ritinha-20261013
