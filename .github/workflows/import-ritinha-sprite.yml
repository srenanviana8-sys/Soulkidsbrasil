name: Importar sprite Ritinha
on:
  push:
    branches:
      - feature/ritinha-passos-aprovados-20261014
permissions:
  contents: write
jobs:
  import-art:
    if: "!contains(github.event.head_commit.message, 'Sprite Ritinha incorporado')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar arte gerada e aprovada
        env:
          ART_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/2fd31a5c-84db-47f0-9713-fceeaa416e67.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZjk2ZmE3OWE2MzNjMjRhOCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjA4MjU4Nn0.pc8DHHhiczyvZ2FABH1OmYl3rz2tNhBbj39jioVTrqc'
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --silent --show-error "$ART_URL" -o ritinha-passos.webp
          test -s ritinha-passos.webp
          test "$(wc -c < ritinha-passos.webp)" -gt 5000
          git config user.name "SoulKids Assets"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ritinha-passos.webp
          git commit -m "Sprite Ritinha incorporado"
          git push
