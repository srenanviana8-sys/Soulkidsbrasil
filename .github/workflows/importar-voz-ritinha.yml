name: Importar convites da Ritinha
on:
  push:
    branches:
      - feature/ritinha-voz-humana-20261014
permissions:
  contents: write
jobs:
  import:
    if: "!contains(github.event.head_commit.message, 'Voices staged')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Salvar oito áudios aprovados e novos convites
        env:
          AUDIO_1: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/f02556a8-51ac-4c32-a97b-ecb92935a6ae/SoulKids___Ritinha_convidando.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWY2YWRlYTRjYTI4OTlhYyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjE2ODYxMn0.aMAaXmywkcb5aekwCV-m6UFLfRuoLiW9CtaSgszepg0"
          AUDIO_2: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/e57dd32b-2a51-4868-b6d0-0e81a5091f88/Ritinha___entrada_da_Casa.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiY2QyZWQyN2E1M2U4ODdlNCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjE1NzgxOH0.7dtLQPOdUgcZhjPQaMhhq3WMp-ad9C4E3WY5DYo83Ts"
          AUDIO_3: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/c9dfe87e-16a4-473f-8d24-d78a00e54657/Ritinha___espelho_das_emo__es.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNTE0YzUzMjU3MDk2MmZkNCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjE1NDkxN30.NOg3fgWbZgOIpHHSpw0SarBZJCxoPIJ0P1kzDzAQiBs"
          AUDIO_4: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/dc336f1a-2533-4bd2-aa72-a38ac932b90a/Ritinha___cantinho_da_calma.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiN2MyNTQ1YjA2NGMyMTQ3YyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjE2Nzg1Nn0.IWGdoeW80H2LtSizUQMxO2umUsSiLPlYJaCQRubBzeE"
          AUDIO_5: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/642f625b-1b3e-47c0-88ce-34a63f1fcc24/Ritinha___hist_rias_da_turma.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDAwNzQ0OTdhYmY5YjhhMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjE1MzExMX0.dLADvmtO5L2bvbFVCgQbEldkfRL0pxJgj53le6JXLJM"
          AUDIO_6: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/70b00e4f-87f0-4ceb-b13a-35485a91dbd5/Ritinha___trilha_do_movimento.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTEwY2M5Yzg3YTIxYTdhYyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjE3NTU2MH0.RbkTLetEcoH9a64yR7lNNEx4p3h4s2hfI2wfvK8Xku8"
          AUDIO_7: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/604b796a-777d-4aed-a7dd-7c0742f77878/Ritinha___espelho_do_corpo.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNGExNDUyMWI1NTI0MjgyYSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjE3NjkyM30.ja1lMES38SHC3mWCuhJnKXMWZ0brHcrC-0wp1cmvkzk"
          AUDIO_8: "https://dnznrvs05pmza.cloudfront.net/text_to_speech/f0fb83f3-2ed7-4d7c-b81e-d550e6def750/Ritinha___bosque_do_ritmo.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjcxNGRiZDJkNTI2ZWVkMCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjE0NjY0Mn0.SG9Dekc6fbifrPS7srWU1joCr5j_GPhlm9gpR1ZBIJA"
        run: |
          set -euo pipefail
          mkdir -p audios
          curl --fail --silent --show-error --location --retry 2 "$AUDIO_1" --output "audios/ritinha-jardim-entrada.mp3"
          test "$(stat -c%s audios/ritinha-jardim-entrada.mp3)" -gt 1000
          curl --fail --silent --show-error --location --retry 2 "$AUDIO_2" --output "audios/ritinha-casa-entrada.mp3"
          test "$(stat -c%s audios/ritinha-casa-entrada.mp3)" -gt 1000
          curl --fail --silent --show-error --location --retry 2 "$AUDIO_3" --output "audios/ritinha-casa-espelho.mp3"
          test "$(stat -c%s audios/ritinha-casa-espelho.mp3)" -gt 1000
          curl --fail --silent --show-error --location --retry 2 "$AUDIO_4" --output "audios/ritinha-casa-calma.mp3"
          test "$(stat -c%s audios/ritinha-casa-calma.mp3)" -gt 1000
          curl --fail --silent --show-error --location --retry 2 "$AUDIO_5" --output "audios/ritinha-casa-historias.mp3"
          test "$(stat -c%s audios/ritinha-casa-historias.mp3)" -gt 1000
          curl --fail --silent --show-error --location --retry 2 "$AUDIO_6" --output "audios/ritinha-jardim-trilha.mp3"
          test "$(stat -c%s audios/ritinha-jardim-trilha.mp3)" -gt 1000
          curl --fail --silent --show-error --location --retry 2 "$AUDIO_7" --output "audios/ritinha-jardim-espelho.mp3"
          test "$(stat -c%s audios/ritinha-jardim-espelho.mp3)" -gt 1000
          curl --fail --silent --show-error --location --retry 2 "$AUDIO_8" --output "audios/ritinha-jardim-ritmo.mp3"
          test "$(stat -c%s audios/ritinha-jardim-ritmo.mp3)" -gt 1000
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "SoulKids audio"
          git add audios/ritinha-*.mp3
          git commit -m "Voices staged for SoulKids"
          git push
