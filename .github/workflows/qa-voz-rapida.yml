name: Verificação rápida das vozes no site
on:
  push:
    branches: [qa/verificar-voz-completa-20261014]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Auditar navegação e falas gravadas
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright'),assert=require('node:assert/strict'),fs=require('fs');
          const m=JSON.parse(fs.readFileSync('audios/ritinha-falas.json','utf8')).clips;
          assert.equal(m.length,48);
          m.forEach(x=>assert.ok(fs.statSync('audios/ritinha-'+x.id+'.mp3').size>1000,x.id));
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
            try{
              for(const profile of [{name:'celular',width:390,height:844,mobile:true},{name:'desktop',width:1280,height:800,mobile:false}]){
                const context=await browser.newContext({viewport:{width:profile.width,height:profile.height},isMobile:profile.mobile,hasTouch:profile.mobile,reducedMotion:'reduce'});
                for(const kind of ['casa','jardim']){
                  const page=await context.newPage(),issues=[];
                  page.setDefaultTimeout(6500);
                  page.on('pageerror',e=>issues.push(String(e)));
                  page.on('response',r=>{if(r.url().startsWith('http://127.0.0.1:8765/')&&r.status()>=400) issues.push('HTTP '+r.status()+' '+r.url());});
                  const file=kind==='casa'?'casa-das-emocoes.html':'jardim-do-movimento.html';
                  const res=await page.goto('http://127.0.0.1:8765/'+file,{waitUntil:'domcontentloaded',timeout:25000});
                  assert.equal(res.status(),200);
                  await page.locator('#ritinha-ouvir').click();
                  let expected='ritinha-'+kind+'-entrada.mp3';
                  let actual=await page.evaluate(()=>window.SoulKidsVozRitinha&&document.querySelector('audio')?.getAttribute('src'));
                  // The player is intentionally created but not appended to the DOM.
                  const source=await page.evaluate(()=>{
                    const state=window.SoulKidsVozRitinha;
                    return state && state.isPlaying();
                  });
                  assert.equal(source,true,'welcome audio started '+file);
                  await page.locator('#ritinha-ouvir').click();
                  if(kind==='casa'){
                    await page.locator('[data-room-open="espelho"]').first().click();
                    await page.locator('[data-feeling="feliz"]').first().click();
                    await page.locator('#mirror-listen').click();
                    assert.ok(await page.evaluate(()=>window.SoulKidsVozRitinha.isPlaying()),'mirror speech');
                    await page.locator('#mirror-listen').click();
                    await page.locator('[data-room-open="historias"]').first().click();
                    await page.locator('[data-story-choice]').first().click();
                    await page.locator('#story-listen').click();
                    assert.ok(await page.evaluate(()=>window.SoulKidsVozRitinha.isPlaying()),'story speech');
                  }else{
                    await page.locator('[data-garden-open="trilha"]').first().click();
                    await page.locator('#trilha-listen').click();
                    assert.ok(await page.evaluate(()=>window.SoulKidsVozRitinha.isPlaying()),'trail speech');
                    await page.locator('#trilha-next').click();
                    await page.locator('#trilha-listen').click();
                    assert.ok(await page.evaluate(()=>window.SoulKidsVozRitinha.isPlaying()),'next trail speech');
                    await page.locator('[data-garden-open="ritmo"]').first().click();
                    await page.locator('#ritmo-speak').click();
                    assert.ok(await page.evaluate(()=>window.SoulKidsVozRitinha.isPlaying()),'rhythm speech');
                    await page.locator('#ritmo-speak').click();
                    await page.locator('#ritmo-listen').click();
                    assert.equal(await page.locator('#ritmo-stop').isVisible(),true,'musical rhythm retained');
                  }
                  const widths=await page.evaluate(()=>[document.documentElement.scrollWidth,window.innerWidth]);
                  assert.ok(widths[0]<=widths[1]+4,'horizontal overflow '+JSON.stringify(widths));
                  assert.deepEqual(issues,[],'errors '+file);
                  console.log('VOICE_BROWSER_OK '+profile.name+' '+file);
                  await page.close();
                }
                await context.close();
              }
            }finally{
              await browser.close();
            }
          })().catch(e=>{console.error('VOICE_QA_FAILED',e);process.exitCode=1;});
          NODE
