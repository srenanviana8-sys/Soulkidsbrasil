name: QA das 48 falas humanas
on:
  push:
    branches: [feature/ritinha-48-falas-humanas-20261014]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspecionar scripts, legendas e os 48 arquivos
        shell: bash
        run: |
          set -euo pipefail
          node --check ritinha-voz.js
          node --check casa-das-emocoes.js
          node --check jardim-do-movimento.js
          test -z "$(grep -n 'speechSynthesis\|SpeechSynthesisUtterance' casa-das-emocoes.js jardim-do-movimento.js || true)"
          node <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const clips=JSON.parse(fs.readFileSync('audios/ritinha-falas.json')).clips;
          assert.equal(clips.length,48);
          assert.equal(new Set(clips.map(x=>x.id)).size,48);
          for(const c of clips){
            const p='audios/ritinha-'+c.id+'.mp3';
            assert.ok(fs.statSync(p).size>1000,p);
            assert.ok(c.text.length<=50,c.id);
          }
          for(const page of ['casa-das-emocoes.html','jardim-do-movimento.html']){
            const html=fs.readFileSync(page,'utf8');
            assert.match(html,/src="\/ritinha-voz\.js"/);
            assert.match(html,/id="ritinha-ouvir"/);
            if(page.startsWith('jardim'))assert.match(html,/id="ritmo-speak"/);
          }
          console.log('STATIC_OK 48 arquivos, transcrições, controles, Javascript e zero voz do navegador');
          NODE
      - name: Preparar navegador
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Teste de navegação em Chrome celular e desktop
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/soulkids-http.log 2>&1 &
          sleep 2
          node <<'NODE'
          const { chromium }=require('playwright');
          const assert=require('node:assert/strict');
          const origin='http://127.0.0.1:8765';
          async function checkClip(page,key){
            const p=page.locator(key.button);
            await p.click();
            await page.waitForTimeout(90);
            const state=await page.evaluate(()=>window.__voiceAudio.map(a=>({src:a.getAttribute('src'),paused:a.paused,readyState:a.readyState,error:a.error?.code??null})));
            assert.equal(state.length,1,'single audio player');
            assert.equal(state[0].src,'/audios/ritinha-'+key.clip+'.mp3',key.clip);
            assert.equal(state[0].error,null,'codec error '+key.clip);
            if(key.stop) await p.click();
          }
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox','--autoplay-policy=no-user-gesture-required']});
            for(const profile of [{name:'Android 390',width:390,height:844,mobile:true},{name:'desktop 1280',width:1280,height:800,mobile:false}]){
              const context=await browser.newContext({viewport:{width:profile.width,height:profile.height},isMobile:profile.mobile,hasTouch:profile.mobile});
              for(const path of ['casa-das-emocoes.html','jardim-do-movimento.html']){
                const page=await context.newPage(),issues=[];
                page.on('pageerror',e=>issues.push('JS '+String(e)));
                page.on('response',res=>{if(res.url().startsWith(origin)&&res.status()>=400)issues.push('HTTP '+res.status()+' '+res.url());});
                await page.addInitScript(()=>{
                  window.__voiceAudio=[];
                  const original=document.createElement.bind(document);
                  document.createElement=function(tag,...args){
                    const created=original(tag,...args);
                    if(String(tag).toLowerCase()==='audio')window.__voiceAudio.push(created);
                    return created;
                  };
                });
                const res=await page.goto(origin+'/'+path,{waitUntil:'domcontentloaded',timeout:45000});
                assert.equal(res.status(),200);
                const voice=page.locator('#ritinha-ouvir');
                await voice.waitFor({state:'visible'});
                assert.equal(await page.evaluate(()=>window.__voiceAudio.length),0,'never autoplay');
                assert.equal(await page.evaluate(()=>typeof window.SoulKidsVozRitinha.playSequence),'function');
                await checkClip(page,{button:'#ritinha-ouvir',clip:(path.startsWith('casa')?'casa':'jardim')+'-entrada',stop:true});
                if(path.startsWith('jardim')){
                  for(const room of ['trilha','espelho','ritmo']){
                    await page.locator('[data-garden-open="'+room+'"]').first().click();
                    const button=room==='ritmo'?'#ritmo-speak':'#'+room+'-listen';
                    for(let index=0;index<6;index++){
                      await checkClip(page,{button,clip:'jardim-'+room+'-'+index,stop:true});
                      if(index<5)await page.locator('#'+room+'-next').click();
                    }
                  }
                  await page.locator('[data-garden-open="ritmo"]').first().click();
                  await page.locator('#ritmo-listen').click();
                  assert.equal(await page.locator('#ritmo-stop').isVisible(),true,'rhythm still works');
                  await page.locator('#ritmo-stop').click();
                  await page.locator('[data-garden-open="trilha"]').first().click();
                  const before=await page.locator('#trilha-art').getAttribute('src');
                  await page.locator('#trilha-next').click();
                  const after=await page.locator('#trilha-art').getAttribute('src');
                  assert.notEqual(before,after,'characters change');
                  console.log('JARDIM_18_OK',profile.name);
                }else{
                  await page.locator('[data-room-open="espelho"]').first().click();
                  assert.equal(await page.locator('#mirror-listen').isDisabled(),true,'nothing selected');
                  for(const emotion of ['feliz','triste','bravo','medo','calmo']){
                    await page.locator('[data-feeling="'+emotion+'"]').first().click();
                    for(let index=0;index<3;index++){
                      await checkClip(page,{button:'#mirror-listen',clip:'casa-espelho-'+emotion+'-'+index,stop:true});
                      if(index<2)await page.locator('#mirror-another').click();
                    }
                  }
                  await page.locator('[data-room-open="historias"]').first().click();
                  for(let i=0;i<5;i++){
                    await checkClip(page,{button:'#story-listen',clip:'casa-historia-'+i,stop:true});
                    for(let ch=0;ch<2;ch++){
                      await page.locator('[data-story-choice]').nth(ch).click();
                      await checkClip(page,{button:'#story-listen',clip:'casa-historia-'+i,stop:false});
                      await page.evaluate(()=>window.__voiceAudio[0].dispatchEvent(new Event('ended')));
                      await page.waitForTimeout(90);
                      const src=await page.evaluate(()=>window.__voiceAudio[0].getAttribute('src'));
                      assert.equal(src,'/audios/ritinha-casa-historia-'+i+'-resposta-'+ch+'.mp3','story response');
                      await page.evaluate(()=>window.SoulKidsVozRitinha.stop());
                    }
                    if(i<4)await page.locator('#story-next').click();
                  }
                  console.log('CASA_30_OK',profile.name);
                }
                const overflow=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,viewport:window.innerWidth}));
                assert.ok(overflow.scroll<=overflow.viewport+4,JSON.stringify(overflow));
                assert.deepEqual(issues,[],'no page JS errors or broken assets');
                console.log('BROWSER_OK',profile.name,path,JSON.stringify(overflow));
                await page.close();
              }
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error('QA_FAILED',e);process.exitCode=1;});
          NODE
