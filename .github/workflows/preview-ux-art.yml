name: Preview authorized SoulKids character art
on:
  push:
    branches: [feature/ux-infantil-menos-texto-20261014]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print small preview
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          import io, base64
          names=['turma-da-ritinha.webp','turma-soulkids.png','ritinha-soulkids-s.png','casa-das-emocoes-interior.webp']
          for name in names:
              img=Image.open(name).convert("RGB")
              dims=img.size
              img.thumbnail((450,280))
              buf=io.BytesIO()
              img.save(buf,format="JPEG",quality=60)
              print('PREVIEW_START',name,dims)
              print(base64.b64encode(buf.getvalue()).decode())
              print('PREVIEW_END',name)
          PY
