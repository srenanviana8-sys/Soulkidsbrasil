name: Conferir origem temporária da arte
on:
  push:
    branches: [fix/ritinha-expressoes-aprovadas-20261014]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir URL publica
        run: |
          code=$(curl -Ls -o /tmp/probe.bin -w '%{http_code}' 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/0e2e0626-aecc-47c8-94d8-d4f6ff75d9ea.png')
          echo "HTTP: $code; bytes: $(wc -c < /tmp/probe.bin)"
