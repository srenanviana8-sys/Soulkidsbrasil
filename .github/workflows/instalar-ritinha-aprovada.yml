name: Aplicar expressoes aprovadas da Ritinha
on:
  push:
    branches: [fix/ritinha-expressoes-aprovadas-20261014]
permissions:
  contents: write
jobs:
  install-art:
    if: "!contains(github.event.head_commit.message, 'Aplicar expressoes aprovadas')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar e reconstruir cinco retratos
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          import base64, hashlib, io
          from pathlib import Path
          from PIL import Image, ImageFilter
          source=''.join(Path(f'staging/ritinha-sprite.part{i}').read_text() for i in range(4))
          content=base64.b64decode(source,validate=True)
          blob=b'blob '+str(len(content)).encode()+b'\0'+content
          expected='b469c2e5ddf0a6fdc150a8af8027ebff0ebd414c'
          assert hashlib.sha1(blob).hexdigest()==expected, 'Integridade da arte aprovada incorreta'
          sheet=Image.open(io.BytesIO(content)).convert('RGB')
          assert sheet.size==(640,128),sheet.size
          for i,mood in enumerate(('feliz','triste','bravo','medo','calmo')):
              portrait=sheet.crop((128*i,0,128*(i+1),128))
              portrait=portrait.resize((256,256),Image.Resampling.LANCZOS)
              portrait=portrait.filter(ImageFilter.UnsharpMask(radius=1,percent=60,threshold=3))
              portrait.save('ritinha-'+mood+'.webp','WEBP',quality=86,method=6)
              print(mood,portrait.size)
          PY
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "SoulKids Assets"
          git add ritinha-feliz.webp ritinha-triste.webp ritinha-bravo.webp ritinha-medo.webp ritinha-calmo.webp
          git diff --staged --quiet && exit 0
          git commit -m "Aplicar expressoes aprovadas: Ritinha"
          git push
