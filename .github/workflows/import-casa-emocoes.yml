name: Importar arte da Casa das Emoções
on:
  push:
    branches:
      - feature/casa-emocoes-interativa-20261014
permissions:
  contents: write
jobs:
  import-illustration:
    if: "!contains(github.event.head_commit.message, 'Arte da casa incorporada')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Otimizar ilustração aprovada
        env:
          ART_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/39e30924-14b6-4b8a-b917-faa377fa91d8.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjk1ZWJiMWQ5MDFlMjU1NSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjA5NDM2NX0.Cb3K69CJVv7JMnk_M9pP5_sy37IzB26ks_SerAt2lJw'
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --silent --show-error "$ART_URL" -o /tmp/casa-original.png
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          image = Image.open('/tmp/casa-original.png').convert('RGB')
          image.thumbnail((1448,1086))
          image.save('casa-das-emocoes-interior.webp', 'WEBP', quality=82, method=6)
          print(image.size)
          PY
          test -s casa-das-emocoes-interior.webp
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "SoulKids Assets"
          git add casa-das-emocoes-interior.webp
          git commit -m "Arte da casa incorporada"
          git push
